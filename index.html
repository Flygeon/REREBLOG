<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-light-32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A5C9E" />
    <meta name="generator" content="Vue 3 + Vite" />
    <!-- 默认 title/description：SSG 构建时按页面 setHead 替换/覆盖 -->
    <title>Flygeonの小站 - Flygeon 的个人博客与自建项目分享</title>
    <meta
      name="description"
      content="Flygeon の个人博客：分享 Web 开发与自建项目（Vue 3 自建 SSG 博客、Cloudflare Workers 动态服务），也记录 Bangumi 追番、设计与日常碎碎念。"
    />
    <!-- Noto Sans SC：正文+标题用（font-display swap 避免 FOIT） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- 主题初始化：在首屏渲染前写入 data-theme，避免暗色模式闪烁 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          // theme 值：'light' | 'dark' | null（null 表示跟随系统）
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
