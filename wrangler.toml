# Cloudflare Workers 部署配置
# 构建产出在 dist/，由 Workers 的 [assets] 静态托管
name = "flygeon-blog"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# 静态资源托管：直接 serve dist/ 下的文件（SSG 预渲染产物）
[assets]
directory = "dist"
binding = "ASSETS"

# Bangumi 封面镜像桶：/pic/* 路由读取，miss 时 Worker 回源 lain.bgm.tv 并写回
[[r2_buckets]]
binding = "BANGUMI_IMG"
bucket_name = "flygeon-bangumi"

# 每日 04:00（北京时间，UTC 20:00）读取 dist/bangumi-images.json 清单预热 R2，
# 覆盖两次构建之间新增的封面，避免国内用户首访回源延迟
[triggers]
crons = ["0 20 * * *"]
